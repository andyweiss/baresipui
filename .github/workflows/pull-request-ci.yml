name: Pull Request CI

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: pull-request-ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  app:
    name: Test and build app
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build application
        run: npm run build

  baresip-build-from-source:
    name: Build baresip from source
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check Docker availability
        id: docker
        shell: bash
        run: |
          if docker info >/dev/null 2>&1; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Docker is unavailable; skipping the baresip image check."
          fi

      - name: Build build-from-source baresip image
        if: steps.docker.outputs.available == 'true'
        run: >-
          docker build
          --file baresip/Dockerfile.build-from-source
          --tag baresipui-ci:build-from-source
          baresip

      - name: Verify mediasoup bridge module
        if: steps.docker.outputs.available == 'true'
        run: >-
          docker run --rm --entrypoint sh
          baresipui-ci:build-from-source
          -c 'for module in /usr/lib/*/baresip/modules/mediasoup_bridge.so;
          do [ -s "$module" ] && exit 0; done; exit 1'
